name: Swing
options:
  bundleIdPrefix: com.matwojcz
  deploymentTarget:
    macOS: "14.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
  LLM:
    url: https://github.com/eastriverlee/LLM.swift
    from: 3.0.3
targets:
  Swing:
    type: application
    platform: macOS
    sources:
      - path: Sources/MoodBattery
    dependencies:
      - package: GRDB
        product: GRDB
      - package: LLM
        product: LLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matwojcz.Swing
        MARKETING_VERSION: "1.1.7"
        CURRENT_PROJECT_VERSION: "9"
        ENABLE_HARDENED_RUNTIME: true
        # Signing the app and the embedded llama.framework with one team keeps the hardened runtime's
        # library validation happy; ad-hoc signatures count as different teams and the framework won't load.
        DEVELOPMENT_TEAM: FKRP65847F
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/MoodBattery/Info.plist
      properties:
        CFBundleDisplayName: Swing
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
