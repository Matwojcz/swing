<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mood battery</title>
<style>
  :root {
    --surface-1: #f4f3ef;
    --border-strong: #444441;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #2c2c2a;
      --border-strong: #b4b2a9;
      --text-secondary: #b4b2a9;
      --text-muted: #888780;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: transparent;
    margin: 0;
    padding: 2rem 1rem;
    display: flex;
    justify-content: center;
  }
  .wrap { max-width: 380px; width: 100%; }
  input[type="range"] { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">
    An interactive battery-shaped mood tracker for bipolar mood states.
  </h2>

  <div style="text-align: center; margin-bottom: 1rem;">
    <div style="font-size: 13px; color: var(--text-secondary);" id="state-label">baseline</div>
    <div style="font-size: 28px; font-weight: 500;" id="val-out">50</div>
  </div>

  <div style="display: flex; justify-content: center; align-items: center; gap: 20px;">
    <div style="position: relative; width: 140px; height: 220px;">
      <div style="position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 40px; height: 12px; border-radius: 4px 4px 0 0; background: var(--surface-1); border: 2px solid var(--border-strong); border-bottom: none;"></div>
      <div style="position: absolute; inset: 0; border-radius: 14px; border: 3px solid var(--border-strong); background: var(--surface-1); overflow: hidden;">
        <div id="fill" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: #378ADD;"></div>
      </div>
      <div style="position: absolute; left: -16px; right: -16px; top: calc(50% - 0.5px); height: 1px; background-image: repeating-linear-gradient(to right, #ffffff 0px, #ffffff 14px, transparent 14px, transparent 24px); pointer-events: none;"></div>
      <div id="spillzone" style="position: absolute; top: -50px; left: 0; width: 100%; height: 50px; pointer-events: none;"></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; height: 220px; justify-content: center;">
      <span style="font-size: 11px; color: var(--text-secondary); writing-mode: vertical-rl; transform: rotate(180deg);">happy</span>
      <div style="width: 30px; height: 160px; display: flex; align-items: center; justify-content: center;">
        <input type="range" id="flavor" min="0" max="100" value="0" style="width: 160px; transform: rotate(90deg);" />
      </div>
      <span style="font-size: 11px; color: var(--text-secondary); writing-mode: vertical-rl;">irritable</span>
    </div>
  </div>

  <input type="range" min="0" max="100" step="1" value="50" id="slider" style="margin-top: 1.5rem;" />
  <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 4px;">
    <span>depressive</span>
    <span>baseline</span>
    <span>hype</span>
  </div>
</div>

<script>
const slider = document.getElementById('slider');
const flavorSlider = document.getElementById('flavor');
const fill = document.getElementById('fill');
const valOut = document.getElementById('val-out');
const stateLabel = document.getElementById('state-label');
const spillzone = document.getElementById('spillzone');

function lerp(a, b, t) { return a + (b - a) * t; }

function interp(stops, v) {
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (v >= stops[i][0] && v <= stops[i + 1][0]) { lo = stops[i]; hi = stops[i + 1]; break; }
  }
  const span = hi[0] - lo[0] || 1;
  const t = (v - lo[0]) / span;
  return lo[1].map(function(c0, i) { return lerp(c0, hi[1][i], t); });
}

const lowStops = [
  [0, [18, 18, 18]],
  [20, [83, 74, 183]],
  [50, [55, 138, 221]]
];
const happyHighStops = [
  [50, [55, 138, 221]],
  [75, [239, 159, 39]],
  [100, [216, 90, 48]]
];
const irritableHighStops = [
  [50, [55, 138, 221]],
  [75, [226, 75, 74]],
  [100, [153, 53, 86]]
];

function colorAt(v, flavor) {
  let c;
  if (v <= 50) {
    c = interp(lowStops, v);
  } else {
    const happy = interp(happyHighStops, v);
    const irritable = interp(irritableHighStops, v);
    const t = flavor / 100;
    c = happy.map(function(c0, i) { return lerp(c0, irritable[i], t); });
  }
  return c.map(Math.round);
}

function rgbStr(c) { return 'rgb(' + c[0] + ', ' + c[1] + ', ' + c[2] + ')'; }

let spillInterval = null;

function spawnDrop(color) {
  const drop = document.createElement('div');
  const startX = 40 + Math.random() * 60;
  drop.style.position = 'absolute';
  drop.style.bottom = '0';
  drop.style.left = startX + 'px';
  drop.style.width = '8px';
  drop.style.height = '8px';
  drop.style.borderRadius = '50%';
  drop.style.background = color;
  spillzone.appendChild(drop);
  const anim = drop.animate([
    { transform: 'translateY(0px)', opacity: 1 },
    { transform: 'translateY(60px)', opacity: 0 }
  ], { duration: 700, easing: 'ease-in' });
  anim.onfinish = function() { drop.remove(); };
}

function update() {
  const v = Number(slider.value);
  const flavor = Number(flavorSlider.value);
  valOut.textContent = v;
  fill.style.height = v + '%';
  const c = colorAt(v, flavor);
  const color = rgbStr(c);
  fill.style.background = color;

  const flavorTag = flavor < 35 ? 'happy' : (flavor > 65 ? 'irritable' : 'mixed');

  let label = 'baseline';
  if (v < 8) label = 'depressive';
  else if (v < 20) label = 'low, heading depressive';
  else if (v < 45) label = 'low';
  else if (v <= 55) label = 'baseline';
  else if (v < 75) label = 'charged up';
  else if (v < 88) label = 'high energy, ' + flavorTag;
  else label = 'hype phase, ' + flavorTag;
  stateLabel.textContent = label;

  if (v >= 88) {
    if (!spillInterval) {
      spillInterval = setInterval(function() { spawnDrop(color); }, 180);
    }
  } else if (spillInterval) {
    clearInterval(spillInterval);
    spillInterval = null;
  }
}

slider.addEventListener('input', update);
flavorSlider.addEventListener('input', update);
update();
</script>
</body>
</html>
