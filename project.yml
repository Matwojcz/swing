name: MoodBattery
options:
  bundleIdPrefix: com.matwojcz
  deploymentTarget:
    macOS: "12.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  MoodBattery:
    type: application
    platform: macOS
    sources:
      - path: Sources/MoodBattery
    dependencies:
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matwojcz.MoodBattery
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "5.0"
    info:
      path: Sources/MoodBattery/Info.plist
      properties:
        CFBundleDisplayName: Mood Battery
        LSMinimumSystemVersion: "12.0"
        NSHumanReadableCopyright: ""
